# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a43b10e6f1a97ebe20d14d8d12dd6be9"
name = "Craftify"
application_url = "https://craft-ify.vercel.app/"
embedded = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Trimmed from the original 8 scopes to what's actually used — src/lib/shopify.ts's
# GraphQL client only ever reads shop{}/products{}/productsCount{}; there is no
# file, product-write, or product-listing mutation anywhere in this codebase.
# Keep this in sync with SHOPIFY_SCOPES in .env.local / Vercel env vars — that's
# the value /api/shopify/install actually sends to Shopify's OAuth authorize URL.
scopes = "read_products,read_inventory,read_locations"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://craft-ify.vercel.app/api/shopify/callback" ]
